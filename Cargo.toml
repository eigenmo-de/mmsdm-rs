[workspace]
resolver = "2"
members = [
    "codegen",
    "xtask",
    "crates/*",
]

[workspace.dependencies.tracing]
version = "0.1.41"
default-features = false
features = ["log"]

[workspace.dependencies.rc-zip-sync]
version = "4.4.2"
default-features = false
features = ["deflate","file"]

[workspace.dependencies.rust_decimal]
version = "1.35.0"
default-features = false
features = []

[workspace.dependencies.num-traits]
version = "0.2.17"
default-features = false
features = []

[workspace.dependencies.chrono]
version = "0.4.33"
features = ["alloc"]
default-features = false

[workspace.dependencies.arrow]
version = "57.1.0"
default-features = false

[workspace.dependencies.csv-core]
version = "0.1.13"
default-features = false

[workspace.dependencies.flate2]
version = "1.1.2"
default-features = false 
features = ["rust_backend"]