[package]
name = "mmsdm-codegen"
version = "0.0.0"
authors = ["Eric Sheppard <eric@eigenmo.de>", "Nayika Sheppard <nayika@eigenmo.de>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/esheppa/aemo-rs"
#maintenance = { status = "experimental" }
description = "Code generation for MMSDM data types"

[dependencies]
html5ever = "0.36.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
csv = "1.4"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
env_logger = "0.11"
reqwest = "0.12"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
codegen = "0.3"
anyhow = "1"
lazy_static = "1.5"
regex = "1.12"
heck = "0.5"
prettyplease = "0.2.9"
syn = "2.0.17"
indexmap = { version = "2.9.0", features = ["serde"] }
